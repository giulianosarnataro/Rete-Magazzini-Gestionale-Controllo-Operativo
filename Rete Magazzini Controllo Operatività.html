<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rete Magazzini Italia</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--text:#14213d;--muted:#6b7690;--border:#e3e8f0;--accent:#2f5bea;--accent-soft:#e8eeff;--ok:#22b45e;--warn:#f5a524;--bad:#e5484d;--off:#d5dae4;--bubble:#eef1f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--surface:#171e30;--text:#e9edf7;--muted:#929cb5;--border:#27304a;--accent:#6c8cff;--accent-soft:#222c4d;--off:#2b3450;--bubble:#222b44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--surface:#171e30;--text:#e9edf7;--muted:#929cb5;--border:#27304a;--accent:#6c8cff;--accent-soft:#222c4d;--off:#2b3450;--bubble:#222b44;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:360px 1fr;height:100%;max-width:1400px;margin:0 auto}
.side{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);min-height:0}
.side header{padding:20px 18px 12px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin:0}
.stats{display:flex;gap:8px;margin-top:14px}
.chip{flex:1;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;transition:.15s}
.chip b{display:block;font-size:18px}
.chip span{font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.search{margin:12px 18px 8px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);width:calc(100% - 36px);outline:none}
.search:focus{border-color:var(--accent)}
.days{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:48px;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:6px 8px;cursor:pointer;text-align:center;transition:.15s}
.day small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase}
.day b{font-size:15px}
.day.on{border-color:var(--accent);background:var(--accent-soft)}
.tag{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px;font-weight:600}
.list{overflow-y:auto;padding:6px 10px 16px;flex:1}
.wh{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:14px;padding:12px;margin-bottom:4px;cursor:pointer;transition:.15s}
.wh:hover{background:var(--bg)}
.wh.sel{background:var(--accent-soft);border-color:var(--accent)}
.wh .n{font-weight:600}
.wh .c{color:var(--muted);font-size:13px;margin-bottom:8px}
.state{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.light{display:inline-flex;gap:4px;padding:4px 6px;background:var(--off);border-radius:99px}
.light i{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.18)}
.light i.on.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.light i.on.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.light i.on.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
.empty .big{font-size:44px}
.top{padding:18px 24px 0;background:var(--surface);border-bottom:1px solid var(--border)}
.back{display:none;border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 12px;margin-bottom:10px;cursor:pointer;font-weight:600}
.top h2{margin:0;font-size:22px;letter-spacing:-.02em}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:6px 0 14px;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{white-space:nowrap}
.net{margin-top:10px;font-size:12.5px;color:var(--muted)}.net b{color:var(--text)}
.trk{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}.trk .bar{height:6px}.trk span{white-space:nowrap}
.trk.warn .bar div,.k.warn .bar div{background:var(--warn)}.trk.bad .bar div,.k.bad .bar div{background:var(--bad)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.k small{color:var(--muted);font-size:12px;font-weight:600}
.k .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:2px 0 8px}
.k .v span{font-size:16px;color:var(--muted);font-weight:600}
.k .d{font-size:12.5px;color:var(--muted);margin-top:8px}
.k.ok .v{color:var(--ok)}.k.warn .v{color:var(--warn)}.k.bad .v{color:var(--bad)}
.k.st0 .v{color:var(--warn)}.k.st1 .v{color:var(--accent)}.k.st2 .v{color:var(--ok)}
.fl{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fb{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600}
.fb.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.hd{margin:0 0 12px;font-size:15px}
.trl{display:grid;gap:10px}
.tc{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 16px}
.tc .av{margin:0;width:38px;height:38px;grid-row:span 2}
.tc small{color:var(--muted);font-size:12.5px}
.steps{grid-column:2/4;display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--off)}
.st0 .steps i.on{background:var(--warn)}.st1 .steps i.on{background:var(--accent)}.st2 .steps i.on{background:var(--ok)}
.sb{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;text-align:center}
.st0 .sb{background:rgba(245,165,36,.16);color:var(--warn)}
.st1 .sb{background:var(--accent-soft);color:var(--accent)}
.st2 .sb{background:rgba(34,180,94,.14);color:var(--ok)}
.upd{border:1px solid var(--border);border-left:4px solid var(--ok);background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.upd.warn{border-left-color:var(--warn)}.upd.bad{border-left-color:var(--bad)}
.upd .uh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.upd .av{width:26px;height:26px;font-size:10px;margin:0}
.upd time{margin-left:auto;font-size:12px;color:var(--muted)}
.upd p{margin:8px 0 0;font-size:14px}
.rq{margin-top:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.rq:hover:not(:disabled){background:var(--accent-soft)}
.rq:disabled{opacity:.7;cursor:default;border-color:var(--border);color:var(--muted)}
.upd.flash{animation:fl 1.4s ease}
.why{margin-top:6px;font-size:13px;font-style:italic}
.why small{display:block;font-style:normal;color:var(--muted);font-size:11.5px;margin-top:2px}
@keyframes fl{0%{background:var(--accent-soft)}100%{background:var(--bg)}}
.tab{border:0;background:transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent)}
.body{flex:1;min-height:0;overflow-y:auto;padding:20px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--off);overflow:hidden}
.bar div{height:100%;background:var(--ok);border-radius:99px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;margin-right:10px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.badge.y{background:rgba(34,180,94,.14);color:var(--ok)}
.badge.n{background:rgba(229,72,77,.14);color:var(--bad)}
.chat{display:flex;flex-direction:column;height:100%;max-width:760px}
.mgr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mgr .av{width:44px;height:44px;font-size:15px;margin:0}
.mgr small{color:var(--muted);display:block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 12px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;background:var(--bubble);align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.m:not(.me){border-bottom-left-radius:4px}
.m time{display:block;font-size:11px;opacity:.65;margin-top:3px}
.compose{display:flex;gap:8px;padding-top:10px}
.compose input{flex:1;padding:12px 16px;border-radius:99px;border:1px solid var(--border);background:var(--surface);outline:none}
.compose input:focus{border-color:var(--accent)}
.send{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:0 22px;font-weight:600;cursor:pointer}
.send:active{transform:scale(.97)}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .main{display:none}
 .app.detail .side{display:none}
 .app.detail .main{display:flex}
 .back{display:inline-block}
 .top,.body{padding-left:16px;padding-right:16px}
 .m{max-width:90%}
}
.rl{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:#9fb3cc}
.rl select{flex:1;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 8px;font:inherit}.rl option{color:#000}
.nav{display:flex;gap:4px;margin-top:12px}
.nv{flex:1;border:1px solid rgba(255,255,255,.16);background:transparent;color:#cfdcec;border-radius:6px;padding:7px 4px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}.nv.on{background:#fff;color:#0f2744;border-color:#fff}.nv i{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;margin-left:4px;font-size:11px}
.map{max-width:560px}.map svg{width:100%;height:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.map polygon{fill:var(--off);stroke:var(--border);stroke-width:1}
.pin{cursor:pointer}.pin circle{stroke:#fff;stroke-width:2.5}.pin text{font-size:10.5px;fill:var(--text);font-weight:600}
.pin.ok circle{fill:var(--ok)}.pin.warn circle{fill:var(--warn)}.pin.bad circle{fill:var(--bad)}
.leg{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--muted)}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.al{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--text)}
.al.s2{border-left-color:var(--bad)}.al.s1{border-left-color:var(--warn)}.al b{display:block}.al small{color:var(--muted)}
.set{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.set select,.is select,.is input{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:6px 8px;font:inherit}
.is{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.is input{flex:1;min-width:180px}
td.cv{text-align:center;font-weight:600}.cv.ok{background:rgba(30,142,90,.14);color:var(--ok)}.cv.warn{background:rgba(201,138,11,.16);color:var(--warn)}.cv.bad{background:rgba(197,48,48,.14);color:var(--bad)}.cv.na{color:var(--muted)}
.badge.w{background:rgba(201,138,11,.16);color:var(--warn)}.badge.i{background:var(--accent-soft);color:var(--accent)}
.ab{margin:4px 6px 0 0;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:3px 10px;font-weight:600;font-size:12px;cursor:pointer}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px}.chart svg{width:100%;height:auto}.chart h3{margin:0 0 8px;font-size:13px}.chart text{font-size:9px;fill:var(--muted)}
.c-ok{fill:var(--ok)}.c-warn{fill:var(--warn)}.c-bad{fill:var(--bad)}
@media print{.side{display:none}.app{display:block;height:auto}.main{display:block}.body{overflow:visible}}
/* ---- Tema aziendale ---- */

.brand{display:flex;align-items:center;gap:12px}

.empty .big{display:none}
.top{padding:20px 28px 0}

.body{padding:20px 28px}
.tab{font-size:13.5px}
.card,.k,.tc,.upd{border-radius:8px}
.upd{background:var(--surface)}
.k{border-top:3px solid var(--border)}
.k.ok,.k.st2{border-top-color:var(--ok)}.k.warn,.k.st0{border-top-color:var(--warn)}.k.bad{border-top-color:var(--bad)}.k.st1{border-top-color:var(--accent)}
.k small{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.k .v{font-size:26px}
th{background:var(--bg);font-size:11px;padding:10px 16px}
td{padding:10px 16px;font-size:13.5px}
tbody tr:hover{background:var(--bg)}
.av{border-radius:6px}
.badge,.sb,.tag{border-radius:4px}
.bar{height:6px;border-radius:3px}.bar div{border-radius:3px}

.m{border-radius:8px}

@media (max-width:820px){.top,.body{padding-left:16px;padding-right:16px}}
</style>

<body>
<div class="app" id="app">
 <aside class="side">
  <header>
   <div class="brand"><span class="logo" aria-hidden="true"></span><div><h1>Rete Magazzini</h1>

   <div class="rl"><span>Vista come</span><select id="role" aria-label="Ruolo"><option value="dir">Direzione operations</option><option value="hr">Risorse umane</option><option value="resp">Responsabile · Hub Logistico Nord</option></select></div>
   <div class="nav" id="nav"></div>
   <div class="days" id="days" role="tablist" aria-label="Scegli il giorno"></div>
   <div class="stats" id="stats"></div>
   <div class="net" id="net"></div>
  </header>
  <input class="search" id="q" type="search" placeholder="Cerca sede o città…" aria-label="Cerca">
  <div class="list" id="list"></div>
 </aside>
 <main class="main" id="main"></main>
</div>

2:["08:10","Siamo in rallentamento. Le condizioni meteo e di marea in laguna ritardano i trasporti via acqua, quindi i mezzi arrivano in ritardo e le baie restano libere a intermittenza. Stimiamo circa 3 ore di ritardo sulle consegne in uscita. Non dipende dal personale."],
3:["07:30","Tutto regolare. Stiamo completando l’inventario trimestrale della zona B senza fermare le attività."],
4:["08:20","Rallentamenti sulle uscite. Il sistema di gestione magazzino (WMS) è in aggiornamento e alcune etichette vengono generate lentamente, mentre uno sciopero dei corrieri locali riduce i ritiri del pomeriggio. Il personale è al completo. Ripristino previsto in giornata."],
5:["06:50","Sede ferma. Un guasto alla cabina elettrica ha bloccato i nastri trasportatori e le celle frigorifere sono su generatore. Il tecnico è in sede e il ripristino è previsto entro stasera. La merce deperibile è stata messa in sicurezza e gli ordini urgenti vengono dirottati su altre sedi."],
6:["07:45","Attività regolare. Segnalo un picco di ordini per la promozione in corso: abbiamo attivato un turno extra per smaltirli."],
7:["08:00","Rallentamento dovuto al ritardo della nave da Napoli, che sposta lo scarico del container principale al pomeriggio. Nel frattempo lavoriamo sugli ordini già in magazzino. Il personale è presente."],
8:["07:35","Operatività piena. Spedizioni verso il continente in linea con il programma e traghetti confermati."],
9:["07:50","Tutto in regola. Oggi è in corso una visita di audit sulla sicurezza, che procede senza fermare le attività."]};
function upd(w){const [h,t]=day?w.du:(w.u||UPD[w.id]);return `<div class="upd ${w.s}${w.fl?" flash":""}" id="ub"><div class="uh"><span class="av">${ini(w.m[0])}</span><b>${day?"Riepilogo di":"Aggiornamento di"} ${w.m[0]}</b><time>${dl(day)}, ${h}</time></div><p>${t}</p>${day?"":`<button class="rq" id="rq" ${w.pend?"disabled":""}>${w.pend?"Richiesta inviata, in attesa di risposta…":"Richiedi nuovo aggiornamento"}</button>`}</div>`;}
const NEW={ok:["Confermo: situazione stabile, nessuna novità dall’ultimo aggiornamento. Spedizioni e ricezioni in linea con il piano.","Aggiornamento rapido: i carichi in uscita sono al 70% del programma della mattinata, nessun intoppo.","Tutto regolare. Abbiamo appena chiuso un’altra tornata di spedizioni e le baie sono libere."],
warn:["Situazione in lento miglioramento: stiamo recuperando parte del ritardo, ma servono ancora alcune ore per tornare a regime.","Nessuna novità risolutiva: restiamo in rallentamento e ti aggiorno appena cambia qualcosa. Gli ordini urgenti hanno la precedenza.","Stiamo riorganizzando le priorità di carico per limitare l’impatto sulle consegne del pomeriggio."],
bad:["Il tecnico ha completato la diagnosi e i pezzi di ricambio sono in arrivo. Sede ancora ferma, ripristino stimato in serata.","Sede ancora ferma. Gli ordini urgenti sono stati dirottati su altre sedi e la merce deperibile è sotto controllo.","Nessun cambio di stato per ora: i lavori di ripristino procedono e ti riscrivo appena si riparte."]};
function bind(){const b=$("#rq");if(b)b.onclick=reqUpd;}
function refreshUpd(id){if(sel!==id)return;const el=$("#ub");if(el){el.outerHTML=upd(W[id]);bind();}}
function reqUpd(){const id=sel,w=W[id];if(w.pend)return;w.pend=true;refreshUpd(id);
 setTimeout(()=>{const r=NEW[w.s0];w.u=[hhmm(),r[Math.floor(Math.random()*r.length)]];w.pend=false;w.fl=true;refreshUpd(id);w.fl=false;},2500+Math.random()*1000);}
let sel=null,tab="dip",filt="all",query="";
const $=s=>document.querySelector(s),ini=n=>n.split(" ").map(x=>x[0]).join("");
const hhmm=()=>new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
const light=s=>`<span class="light"><i class="ok ${s==="ok"?"on":""}"></i><i class="warn ${s==="warn"?"on":""}"></i><i class="bad ${s==="bad"?"on":""}"></i></span>`;
function stats(){const T=vis().reduce((a,w)=>a+w.e.length,0),O=vis().reduce((a,w)=>a+w.e.filter(e=>e.ok).length,0),V=vis().reduce((a,w)=>a+w.tr.filter(x=>x.st===1).length,0);$("#net").innerHTML=`Rete: <b>${O}/${T}</b> dipendenti presenti · <b>${V}</b> mezzi in viaggio`;const c=k=>vis().filter(w=>w.s===k).length;
 $("#stats").innerHTML=[["all","Tutte",vis().length],["ok","Operative",c("ok")],["warn","Rallentate",c("warn")],["bad","Ferme",c("bad")]]
 .map(([k,l,n])=>`<button class="chip ${filt===k?"on":""}" data-f="${k}"><b>${n}</b><span>${l}</span></button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filt=b.dataset.f;stats();list();});}
function list(){const q=query.toLowerCase();
 const a=vis().filter(w=>(filt==="all"||w.s===filt)&&(w.n+w.c+w.r).toLowerCase().includes(q));
 $("#list").innerHTML=a.length?a.map(w=>`<button class="wh ${sel===w.id?"sel":""}" data-id="${w.id}"><div class="n">${w.n}</div><div class="c">${w.c} · ${w.r}</div><div class="state">${light(w.s)}<span class="${ST[w.s][1]}">${ST[w.s][0]}</span></div>${trk(w)}</button>`).join(""):`<p class="empty">Nessuna sede trovata</p>`;
 document.querySelectorAll(".wh").forEach(b=>b.onclick=()=>{sel=+b.dataset.id;tab="dip";view="sede";nav();$("#app").classList.add("detail");list();detail();});}
function detail(){const m=$("#main");if(view!=="sede"){panel(m);return;}
 if(sel===null){m.innerHTML=`<div class="empty"><div class="big">🏭</div><h2>Seleziona un magazzino</h2><p>Scegli una sede dall’elenco per vedere dipendenti e contattare il responsabile.</p></div>`;return;}
 const w=W[sel],ok=w.e.filter(e=>e.ok).length,p=Math.round(ok/w.e.length*100);
 m.innerHTML=`<div class="top"><button class="back" id="bk">← Sedi</button><h2>${w.n}</h2>
 <div class="row"><span>${w.c}, ${w.r}</span><span class="state">${light(w.s)}<span class="${ST[w.s][1]}">${ST[w.s][0]}</span></span><span>Responsabile: ${w.m[0]}</span>${day?`<span class="tag">Storico · ${dfull(day)}</span>`:""}</div>
 ${upd(w)}<div class="tabs"><button class="tab ${tab==="dip"?"on":""}" data-t="dip">Dipendenti ${ok}/${w.e.length}</button><button class="tab ${tab==="tr"?"on":""}" data-t="tr">Trasporti (${w.tr.length})</button><button class="tab ${tab==="cv"?"on":""}" data-t="cv">Copertura</button><button class="tab ${tab==="is"?"on":""}" data-t="is">Segnalazioni (${w.iss.filter(i=>i.st!=='Risolta').length})</button>${role==='resp'?'':`<button class="tab ${tab==="chat"?"on":""}" data-t="chat">Chat con il manager</button>`}</div></div>
 <div class="body" id="bd"></div>`;
 $("#bk").onclick=()=>{$("#app").classList.remove("detail");};bind();
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;detail();});
 const bd=$("#bd");
 if(tab==="dip"){bd.innerHTML=`<div class="kp"><div class="k ${cv(w).c}"><small>Dipendenti presenti</small><div class="v">${ok}<span>/${w.e.length}</span></div><div class="bar"><div style="width:${p}%"></div></div><div class="d">${p}% della squadra è in sede</div></div><div class="k ${w.e.length-ok?"bad":"ok"}"><small>Mancano</small><div class="v">${w.e.length-ok}</div><div class="d">ingressi non confermati · ${pend(w)} giustificativi in attesa</div></div></div><div class="fl"><button class="fb ${miss?"":"on"}" data-m="0">Tutti (${w.e.length})</button><button class="fb ${miss?"on":""}" data-m="1">Solo mancanti (${w.e.length-ok})</button></div>
 <div class="card scroll"><table><thead><tr><th>Nominativo</th><th>Ruolo</th><th>Ingresso badge</th></tr></thead><tbody>${w.e.filter(e=>!miss||!e.ok).map(e=>`<tr><td><span class="av">${ini(e.n)}</span>${e.n}</td><td>${e.r}</td><td>${e.ok?`<span class="badge y">✓ Confermato · ${e.t}</span>`:`<span class="badge n">✕ Non confermato</span><div class="why">${priv()?"“"+e.mo+"”":"Motivo riservato a HR e al responsabile"}<small>${apBadge(w,e)}</small></div>`}</td></tr>`).join("")}</tbody></table></div>`;document.querySelectorAll(".fb").forEach(b=>b.onclick=()=>{miss=b.dataset.m==="1";detail();});document.querySelectorAll(".ab").forEach(b=>b.onclick=()=>{AP[b.dataset.k]=b.dataset.v;nav();detail();});}
 else if(tab==="tr"){bd.innerHTML=trHtml(w);}else if(tab==="cv"){bd.innerHTML=covHtml(w);}else if(tab==="is"){bd.innerHTML=issHtml(w);bindIs(w);}
 else{bd.innerHTML=`<div class="chat"><div class="mgr"><span class="av">${ini(w.m[0])}</span><div><b>${w.m[0]}</b><small><span class="dot"></span>Responsabile sede · ${w.m[1]}</small></div></div>
 <div class="msgs" id="ms"></div><div class="compose"><input id="in" placeholder="Scrivi un messaggio…" autocomplete="off" aria-label="Messaggio"><button class="send" id="sd">Invia</button></div></div>`;
 msgs();$("#sd").onclick=send;$("#in").onkeydown=e=>{if(e.key==="Enter")send();};}}
function msgs(){const w=W[sel],ms=$("#ms");if(!ms)return;ms.innerHTML="";
 w.msgs.forEach(x=>{const d=document.createElement("div");d.className="m"+(x.me?" me":"");d.textContent=x.t;const t=document.createElement("time");t.textContent=x.h;d.appendChild(t);ms.appendChild(d);});
 ms.scrollTop=ms.scrollHeight;}
function send(){const i=$("#in"),v=i.value.trim();if(!v)return;const id=sel,w=W[id];
 w.msgs.push({me:1,t:v,h:hhmm()});i.value="";msgs();
 setTimeout(()=>{const r=REP[w.s0];w.msgs.push({me:0,t:r[Math.floor(Math.random()*r.length)],h:hhmm()});if(sel===id&&tab==="chat")msgs();},1200);}
$("#q").oninput=e=>{query=e.target.value;list();};
days();nav();stats();list();detail();
$("#role").onchange=e=>{role=e.target.value;view='sede';tab='dip';sel=role==='resp'?0:null;$("#app").classList.toggle('detail',role==='resp');nav();stats();list();detail();};
</script>
</body>
</html>
